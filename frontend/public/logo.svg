<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360">
  <defs>
    <clipPath id="iris">
      <circle cx="256" cy="256" r="100"/>
    </clipPath>
    <radialGradient id="irisFill" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F1F8F3"/>
      <stop offset="100%" stop-color="#D3EBDB"/>
    </radialGradient>
    <g id="blade">
      <path d="M -9 -14 C -14 -52 -8 -90 1 -110 C 6 -84 11 -50 9 -14 Z"/>
    </g>
  </defs>

  <g transform="translate(20 0) scale(0.703) translate(0 0)">
    <path d="M 28 256 Q 256 8 484 256 Q 256 504 28 256 Z"
          fill="#FFFFFF" stroke="#14532D" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="100" fill="url(#irisFill)"/>
    <g clip-path="url(#iris)">
      <path d="M 140 312 Q 200 292 262 306 T 400 300 L 400 400 L 140 400 Z" fill="#9FD3B0"/>
      <path d="M 140 334 Q 220 318 300 332 T 400 328 L 400 400 L 140 400 Z" fill="#5FAE7C"/>
    </g>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#1E7A46" stroke-width="10"/>
    <g transform="translate(256 251) scale(0.84)" fill="#14532D">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      <use href="#blade"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
      </g>
      <circle r="17"/>
      <circle r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <text x="400" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="120" letter-spacing="-2">
    <tspan font-weight="700" fill="#14532D">Wind</tspan><tspan font-weight="400" fill="#1E7A46">Blick</tspan>
  </text>
  <text x="404" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="500" letter-spacing="6" fill="#5FAE7C">VISUALIZATION</text>
</svg>
